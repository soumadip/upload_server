<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Environment Setup</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #f1f5f9; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            min-height: 100vh; 
            color: #334155;
        }
        .login-card { 
            background: #ffffff; 
            padding: 45px; 
            border-radius: 12px; 
            box-shadow: 0 10px 25px -5px rgba(0,0,0,0.05), 0 8px 10px -6px rgba(0,0,0,0.01); 
            width: 100%; 
            max-width: 520px; 
            border: 1px solid #e2e8f0;
        }
        .form-control { border-radius: 8px; border-color: #cbd5e1; padding: 10px 15px; }
        .form-control:focus { box-shadow: 0 0 0 3px rgba(13, 110, 253, 0.15); border-color: #94a3b8; }
        .btn-primary { border-radius: 8px; font-weight: 600; letter-spacing: 0.3px; padding: 12px; }
    </style>
</head>
<body oncopy="return false" oncut="return false" onpaste="return false">
    <div class="login-card">
        <h3 class="text-center mb-4 fw-bold" style="color: #0f172a;">Lab Environment Setup</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }} rounded-3 shadow-sm border-0">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase">Full Name</label>
                <input type="text" name="name" class="form-control" pattern="[a-zA-Z ]{3,}" title="Only letters and spaces allowed" placeholder="e.g., Jane Doe" required>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-semibold text-secondary small text-uppercase">Department</label>
                <div class="d-flex flex-wrap gap-2" role="group">
                    {% for dept in departments %}
                        <input type="radio" class="btn-check" name="dept" id="dept_{{ loop.index }}" value="{{ dept }}" required>
                        <label class="btn btn-outline-primary rounded-3 px-4" for="dept_{{ loop.index }}">{{ dept }}</label>
                    {% endfor %}
                </div>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <label class="form-label fw-semibold text-secondary small text-uppercase">Roll No</label>
                    <input type="text" name="roll_no" class="form-control" placeholder="e.g. 11" required>
                </div>
                <div class="col-md-8 mt-3 mt-md-0">
                    <label class="form-label fw-semibold text-secondary small text-uppercase">Enrollment No</label>
                    <input type="text" name="enrollment_no" class="form-control" placeholder="Alphanumeric only" required>
                </div>
            </div>
            
            <div class="mb-5">
                <label class="form-label fw-semibold text-secondary small text-uppercase">Confirm Enrollment No</label>
                <input type="text" name="enrollment_no_confirm" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 shadow-sm">Initialize Session</button>
        </form>
    </div>
</body>
</html>
