<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Environment Setup</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f4f6f9; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
        .login-card { background: #fff; padding: 40px; border-radius: 10px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); width: 100%; max-width: 500px; }
    </style>
</head>
<body oncopy="return false" oncut="return false" onpaste="return false">
    <div class="login-card">
        <h3 class="text-center mb-4 fw-bold">Lab Environment Setup</h3>
        
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ 'success' if category == 'success' else 'danger' }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Full Name</label>
                <input type="text" name="name" class="form-control" pattern="[a-zA-Z ]{3,}" title="Only letters and spaces allowed" required>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Department</label>
                <div class="d-flex flex-wrap gap-3">
                    {% for dept in departments %}
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="dept" value="{{ dept }}" id="dept_{{ loop.index }}" required>
                            <label class="form-check-label" for="dept_{{ loop.index }}">{{ dept }}</label>
                        </div>
                    {% endfor %}
                </div>
            </div>

            <div class="row">
                <div class="col-md-4 mb-3">
                    <label class="form-label fw-bold">Roll No</label>
                    <input type="text" name="roll_no" class="form-control" required>
                </div>
                <div class="col-md-8 mb-3">
                    <label class="form-label fw-bold">Enrollment No</label>
                    <input type="text" name="enrollment_no" class="form-control" required>
                </div>
            </div>
            
            <div class="mb-4">
                <label class="form-label fw-bold">Confirm Enrollment No</label>
                <input type="text" name="enrollment_no_confirm" class="form-control" required>
            </div>

            <button type="submit" class="btn btn-primary w-100 py-2 fw-bold">Initialize Session</button>
        </form>
    </div>
</body>
</html>
